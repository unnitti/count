<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="실수량 계산">
<meta name="theme-color" content="#f3f6fb">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/svg+xml" href="icons/icon.svg">
<link rel="manifest" href="manifest.json">
<title>실수량 계산</title>
<style>
  :root {
    --bg: #f3f6fb; --card: #fff; --text: #1d2330; --sub: #7a8394;
    --line: #e1e6ef; --blue: #3d8df5; --green: #39b978; --key: #e9edf5;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; touch-action: manipulation; }
  html, body { margin: 0; height: 100%; }
  body {
    background: var(--bg); color: var(--text);
    font-family: -apple-system, "Apple SD Gothic Neo", sans-serif;
    padding: max(12px, env(safe-area-inset-top)) 12px max(12px, env(safe-area-inset-bottom));
    display: flex; flex-direction: column; gap: 10px;
    -webkit-user-select: none; user-select: none;
  }
  .card {
    flex: 1; min-height: 0; display: flex; flex-direction: column; gap: 4px;
    background: var(--card); border: 1px solid var(--line);
    border-radius: 16px; padding: 10px 14px;
    box-shadow: 0 1px 3px rgba(30, 50, 90, .06);
  }
  .card label { font-size: 13px; font-weight: 600; color: var(--sub); }
  textarea {
    flex: 1; min-height: 0; width: 100%; resize: none;
    border: 0; outline: 0; background: transparent; color: var(--text);
    font-size: 18px; line-height: 1.5; font-family: inherit; padding: 0;
    -webkit-user-select: text; user-select: text;
  }
  textarea::placeholder { color: #b4bbc8; }
  .row { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
  .row button { font-size: 15px; padding: 12px 4px; line-height: 1.2; }
  button {
    font-family: inherit; font-size: 18px; font-weight: 700; padding: 14px;
    border: 0; border-radius: 14px; color: #fff;
    box-shadow: 0 2px 6px rgba(30, 50, 90, .12);
  }
  button:active { opacity: .75; transform: scale(.98); }
  #convert { background: var(--blue); }
  #clear { background: #8c95a6; }
  #copy { background: var(--green); }
  .pad { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
  .pad button {
    background: var(--card); color: var(--text); font-size: 22px; font-weight: 600;
    padding: 0; height: 50px; border: 1px solid var(--line); box-shadow: none;
    transition: transform 110ms ease-out, box-shadow 110ms ease-out;
    transform-origin: center;
  }
  @keyframes key-pop {
    0%, 100% { transform: scale(1); }
    35% { transform: scale(1.08); }
  }
  .pad button.key-pop {
    animation: key-pop 220ms ease-out;
    position: relative;
    z-index: 1;
  }
  .pad button[data-k="space"] {
    font-weight: 800;
    -webkit-text-stroke: .7px currentColor;
  }
  .pad button.fn { background: var(--key); font-size: 20px; }
  .pad .w2 { grid-column: span 2; }
  .pad button.backspace-key { display: flex; align-items: center; justify-content: center; gap: 7px; }
  .pad .debug-version { font-size: 11px; font-weight: 600; color: var(--sub); }
  .pad .line-delete { display: flex; align-items: center; justify-content: center; gap: 6px; font-size: 14px; white-space: nowrap; }
  .modal { position: fixed; inset: 0; background: rgba(20, 30, 50, .45); display: none;
           align-items: center; justify-content: center; padding: 24px; }
  .modal.show { display: flex; }
  .dialog { background: var(--card); border-radius: 18px; padding: 20px; width: 100%; max-width: 320px;
            box-shadow: 0 8px 30px rgba(20, 30, 50, .25); }
  .dialog p { margin: 0 0 16px; font-size: 17px; font-weight: 600; text-align: center; }
  .dialog .btns { display: flex; gap: 10px; }
  .dialog button { flex: 1; font-size: 17px; padding: 13px; }
  #no { background: #8c95a6; }
  #yes { background: #e5484d; }
</style>
</head>
<body>
  <div class="card">
    <label for="input">입력</label>
    <textarea id="input" inputmode="none" placeholder="22 11 3&#10;10 5&#10;&#10;7&#10;(빈 줄로 구간 나누기)"></textarea>
  </div>
  <div class="card">
    <label for="output">결과</label>
    <textarea id="output" readonly inputmode="none" placeholder="변환 결과가 여기에 표시돼요"></textarea>
  </div>
  <div class="row">
    <button id="convert">계산</button>
    <button id="clear">전체 지움</button>
    <button id="copy">클립보드에 복사</button>
  </div>
  <div class="pad" id="pad">
    <button data-k="1">1</button><button data-k="2">2</button><button data-k="3">3</button><button data-k="0">0</button>
    <button data-k="4">4</button><button data-k="5">5</button><button data-k="6">6</button><button class="fn" data-k="space" aria-label="빈칸">␣</button>
    <button data-k="7">7</button><button data-k="8">8</button><button data-k="9">9</button><button class="fn" data-k="enter" aria-label="줄바꿈">↵</button>
    <button class="fn w2 backspace-key" data-k="back" aria-label="백스페이스"><span>⌫</span><span class="debug-version">(build: d00021)</span></button>
    <button class="fn w2 line-delete" data-k="line" aria-label="한 줄 지움"><span aria-hidden="true">⇤</span><span>(한 줄 지움)</span></button>
  </div>
  <div class="modal" id="modal">
    <div class="dialog">
      <p>내용을 모두 지울까요?</p>
      <div class="btns"><button id="no">취소</button><button id="yes">지우기</button></div>
    </div>
  </div>

<script>
const $ = id => document.getElementById(id);
const inp = $('input');

/* ---- 키패드 ---- */
function press(k) {
  inp.focus({ preventScroll: true });
  let s = inp.selectionStart, e = inp.selectionEnd;

  // 지원되는 Android 브라우저에서는 짧은 진동으로 입력 피드백 제공
  if (navigator.vibrate) navigator.vibrate(10);

  if (k === 'back') {
    if (s === e && s > 0) s--;
    inp.setRangeText('', s, e, 'end');
    return;
  }

  if (k === 'line') {에
    // 선택 영역이 있으면 선택 시작점이 속한 줄을 기준으로 삭제
    const lineStart = inp.value.lastIndexOf('\n', Math.max(0, s - 1)) + 1;
    const nextNewline = inp.value.indexOf('\n', s);
    const lineEnd = nextNewline === -1 ? inp.value.length : nextNewline + 1;
    const deleteStart = nextNewline === -1 && lineStart > 0 ? lineStart - 1 : lineStart;
    inp.setRangeText('', deleteStart, lineEnd, 'start');
    return;
  }

  const t = k === 'space' ? ' ' : k === 'enter' ? '\n' : k;
  inp.setRangeText(t, s, e, 'end');
}
const pad = $('pad');

pad.addEventListener('click', ev => {
  const b = ev.target.closest('button');
  if (!b) return;

  // Play the visual feedback from the same click event that handles the key input.
  b.classList.remove('key-pop');
  void b.offsetWidth; // Restart the CSS animation, including on consecutive taps.
  b.classList.add('key-pop');
  b.addEventListener('animationend', () => b.classList.remove('key-pop'), { once: true });

  press(b.dataset.k);
});

/* ---- 계산 (CALC_START) ---- */
function parse(text) {
  const groups = [];
  let cur = [];
  const flush = () => { if (cur.length) groups.push(cur); cur = []; };
  for (const raw of text.split('\n')) {
    const line = raw.trim();
    if (!line) { flush(); continue; }
    const n = line.split(/[\s,.*xX×]+/).filter(Boolean).map(Number);
    if (n.length < 1 || n.length > 3 || n.some(isNaN)) {
      cur.push({ error: true, text: '입력 오류: ' + line });
    } else if (n.length === 3) {
      const r = n[0] * n[1] + n[2];
      cur.push({ r, view: `${n[0]}박스 x ${n[1]}입 + ${n[2]}개 = ${r}`,
                 copy: `(박스${n[0]}x입수${n[1]}+낱개${n[2]}=${r})` });
    } else if (n.length === 2) {
      const r = n[0] * n[1];
      cur.push({ r, view: `${n[0]}박스 x ${n[1]}입 = ${r}`,
                 copy: `(박스${n[0]}x입수${n[1]}=${r})` });
    } else {
      const r = n[0];
      cur.push({ r, view: `${r}개 = ${r}`, copy: `(낱개${r}=${r})` });
    }
  }
  flush();
  let total = 0;
  const gs = groups.map(items => {
    const sum = items.reduce((a, it) => a + (it.error ? 0 : it.r), 0);
    total += sum;
    return { items, sum };
  });
  return { groups: gs, total };
}

function buildView(res) {
  if (!res.groups.length) return '';
  const parts = res.groups.map(g =>
    g.items.map(it => it.error ? it.text : it.view).join('\n') + `\n합계 : ${g.sum}`);
  return [`총 수량 : ${res.total}`, ...parts].join('\n\n');
}

function buildCopy(res) {
  const out = [`총 수량 : ${res.total}`];
  for (const g of res.groups) {
    out.push(` / ${g.sum}`);
    for (const it of g.items) out.push(it.error ? it.text : `(${it.view})`);
  }
  return out.join('\n');
}
/* ---- CALC_END ---- */

let last = null;
function convert() {
  last = parse(inp.value);
  $('output').value = buildView(last);
}

function fallbackCopy(text) {
  const t = document.createElement('textarea');
  t.value = text;
  t.style.cssText = 'position:fixed;top:0;left:0;opacity:0;font-size:16px';
  document.body.appendChild(t);
  t.focus(); t.select(); t.setSelectionRange(0, text.length);
  document.execCommand('copy');
  t.remove();
}

async function copy() {
  if (!last || !last.groups.length) return;
  const text = buildCopy(last);
  try {
    await navigator.clipboard.writeText(text);
  } catch (e) {
    fallbackCopy(text);
  }
  const b = $('copy');
  b.textContent = '복사됨 ✓';
  setTimeout(() => { b.textContent = '클립보드에 복사'; }, 1200);
}

$('convert').addEventListener('click', convert);
$('clear').addEventListener('click', () => { if (inp.value || $('output').value) $('modal').classList.add('show'); });
$('no').addEventListener('click', () => $('modal').classList.remove('show'));
$('yes').addEventListener('click', () => {
  inp.value = '';
  $('output').value = '';
  last = null;
  $('modal').classList.remove('show');
});
$('copy').addEventListener('click', copy);
</script>
<script>
  if ("serviceWorker" in navigator) {
    window.addEventListener("load", () => {
      navigator.serviceWorker.register("./sw.js").catch(() => {});
    });
  }
</script>
</body>
</html>
